services:
  - type: web
    name: julebu-learning-platform
    env: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5188
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-5.5
      - key: OPENAI_REASONING_EFFORT
        value: high
    disk:
      name: julebu-learning-data
      mountPath: /app/local-data
      sizeGB: 1
